name: Lotto results — update verified draw data

on:
  schedule:
    # Saturday 18:00 KST (09:00 UTC), before the 20:00 KST evidence cutoff.
    - cron: '0 9 * * 6'
    # Saturday 22:20 KST and Sunday 09:20 KST
    - cron: '20 13 * * 6'
    - cron: '20 0 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Update draws and evaluate, or freeze this Saturday’s prediction'
        type: choice
        options: [update-evaluate, predict]
        default: update-evaluate
      manual_round:
        description: 'Optional manual official draw round'
        required: false
      manual_date:
        description: 'Official draw date YYYY-MM-DD'
        required: false
      manual_numbers:
        description: 'Six numbers separated by commas'
        required: false
      manual_bonus:
        description: 'Official bonus number'
        required: false
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/update_draws.py'
      - 'scripts/live*'
      - 'scripts/build-live-index.mjs'
      - 'scripts/build_pages.py'
      - 'tests/**'
      - 'data/draws.json'
      - '.github/workflows/update.yml'

permissions:
  contents: write
  statuses: write
  actions: read

concurrency:
  group: lotto-public-data-updater
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LOTTO_MODE: ${{ (github.event.schedule == '0 9 * * 6' || inputs.mode == 'predict') && 'predict' || 'update-evaluate' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Dashboard and research regression tests
        run: node --test tests/*.cjs
      - name: Configure archive commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Freeze predictions or update and evaluate official results
        id: live
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_ROUND: ${{ inputs.manual_round }}
          MANUAL_DATE: ${{ inputs.manual_date }}
          MANUAL_NUMBERS: ${{ inputs.manual_numbers }}
          MANUAL_BONUS: ${{ inputs.manual_bonus }}
        run: |
          if [[ "$LOTTO_MODE" == 'predict' ]]; then
            node scripts/live-predictions.mjs predict
          else
            node scripts/live-predictions.mjs evaluate
          fi
      - name: Commit archive, receipts, evaluation results and health
        run: |
          git add data/draws.json
          for path in data/prediction-receipts data/evaluations data/evaluation-revisions data/live-health.json; do
            if [[ -e "$path" ]]; then git add -- "$path"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: archive lotto results and live evaluation'
          git push
      - name: Report live processing issue
        if: steps.live.outcome == 'failure'
        run: echo '::warning::Live prediction verification did not complete. See the live processing log and health record.'

  deploy:
    name: Publish latest dashboard + draw data
    needs: update
    if: ${{ github.ref == 'refs/heads/main' && needs.update.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - name: Prepare public artifacts only
        run: python3 scripts/build_pages.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
